<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Metallic Champagne Gold Gradient -->
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4DD" />
      <stop offset="25%" stop-color="#E5C77A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#EAD18D" />
    </linearGradient>

    <!-- Warm Amber Glow -->
    <linearGradient id="warmAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C08081" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#D8A49B" />
    </linearGradient>

    <!-- Dusty Rose Subtle Tint -->
    <linearGradient id="dustyRose" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8A49B" />
      <stop offset="100%" stop-color="#F3D8D8" />
    </linearGradient>

    <!-- Drop Shadow for Luxury Depth -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background is transparent so it seamlessly adapts to obsidian black or light themes -->

  <g transform="translate(140, 20)">
    <!-- LUXURY CREST EMBLEM -->
    <g transform="translate(0, 5)">
      <!-- Outer Filigree / Botanical Laurels (Freshness & Botanicals) -->
      <path d="M-45,55 C-55,30 -45,5 -20,-15 C-15,5 -25,25 -15,40" fill="none" stroke="url(#champagneGold)" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
      <path d="M-40,35 C-50,22 -38,10 -30,22" fill="none" stroke="url(#champagneGold)" stroke-width="1.4" opacity="0.7" />
      <path d="M-30,12 C-38,2 -25,-6 -20,6" fill="none" stroke="url(#champagneGold)" stroke-width="1.4" opacity="0.7" />

      <path d="M45,55 C55,30 45,5 20,-15 C15,5 25,25 15,40" fill="none" stroke="url(#champagneGold)" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
      <path d="M40,35 C50,22 38,10 30,22" fill="none" stroke="url(#champagneGold)" stroke-width="1.4" opacity="0.7" />
      <path d="M30,12 C38,2 25,-6 20,6" fill="none" stroke="url(#champagneGold)" stroke-width="1.4" opacity="0.7" />

      <!-- Center Medallion / Droplet Aura (Fragrance, Beauty & Freshness) -->
      <path d="M0,-24 C14,-10 24,10 24,30 C24,46 13,60 0,60 C-13,60 -24,46 -24,30 C-24,10 -14,-10 0,-24 Z" 
            fill="none" stroke="url(#champagneGold)" stroke-width="2" />
      
      <!-- Subtle faceted perfume crystal cut lines -->
      <path d="M0,-24 L0,60 M-20,20 L20,20 M-17,40 L17,40" 
            fill="none" stroke="url(#champagneGold)" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 2" />

      <!-- Iconic Intertwined 'M' Monogram with royal serifs -->
      <path d="M-15,45 L-15,18 L-2,36 L2,36 L15,18 L15,45" 
            fill="none" stroke="url(#champagneGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Top Radiant Sparkle / Goodies Crown Star -->
      <polygon points="0,-32 2,-25 9,-25 3,-20 5,-13 0,-17 -5,-13 -3,-20 -9,-25 -2,-25" 
               fill="url(#champagneGold)" />

      <!-- Delicate Tote / Gift Arc Silhouette at base (Unique Goodies) -->
      <path d="M-22,66 C-12,72 12,72 22,66" fill="none" stroke="url(#warmAmber)" stroke-width="1.6" stroke-linecap="round" />
      <circle cx="0" cy="74" r="2" fill="url(#champagneGold)" />
    </g>

    <!-- TYPOGRAPHY LOCKUP -->
    <!-- Brand Name: MADINMA -->
    <text x="95" y="62" 
          font-family="'Playfair Display', 'Cinzel', 'Didot', 'Bodoni MT', 'Georgia', serif" 
          font-size="52" 
          font-weight="600" 
          letter-spacing="14" 
          fill="url(#champagneGold)" 
          filter="url(#goldGlow)">MADINMA</text>

    <!-- Tagline: COLLECTIONS • HAUTE PARFUMERIE -->
    <text x="98" y="94" 
          font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
          font-size="12.5" 
          font-weight="400" 
          letter-spacing="9" 
          fill="#EDE6DC" 
          opacity="0.9">COLLECTIONS</text>

    <!-- Refined Sub-descriptor with Dusty Rose Accent Dot -->
    <text x="315" y="93" 
          font-family="'Montserrat', sans-serif" 
          font-size="10" 
          letter-spacing="4" 
          fill="#D8A49B" 
          opacity="0.85">•  FINE FRAGRANCE &amp; FRESHNESS</text>
  </g>
</svg>
